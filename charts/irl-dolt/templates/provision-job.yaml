{{- if or .Values.databases .Values.users }}
# Runs after every install and upgrade. With `helm upgrade --wait` Helm holds
# the hook until the server is Ready; without it the script waits itself.
# A failure fails the release, so a missing password key or a refused grant
# is visible at deploy time instead of at first connection.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "irl-dolt.fullname" . }}-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irl-dolt.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    # Replace the previous run's Job, but keep this one around afterwards
    # (until the TTL) so its log can still be read.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.provision.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.provision.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.provision.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "irl-dolt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: provision
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: provision
          image: {{ include "irl-dolt.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bash", "/scripts/provision.sh"]
          env:
            {{- include "irl-dolt.clientEnv" . | nindent 12 }}
            {{- range $i, $u := .Values.users }}
            - name: DOLT_USER_PASSWORD_{{ $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "irl-dolt.secretName" $ }}
                  key: {{ include "irl-dolt.userPasswordKey" $u }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.provision.resources | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: {{ include "irl-dolt.fullname" . }}-scripts
        - name: tmp
          emptyDir: {}
{{- end }}
