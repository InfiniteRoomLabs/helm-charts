{{- if not .Values.auth.existingSecret }}
{{- /*
Chart-managed credentials. Each key is generated once and then read back from
the live Secret on every later render, so `helm upgrade` never re-rolls a
password (the randAlphaNum trap). `helm template` and --dry-run cannot look
anything up and print throwaway values, which is fine: nothing consumes them.
The keep policy means `helm uninstall` leaves the Secret behind, next to the
volume it unlocks.
*/ -}}
{{- $name := include "irl-dolt.secretName" . }}
{{- $live := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $live "data") | default dict }}
{{- $keys := list .Values.auth.rootPasswordKey }}
{{- range .Values.users }}
{{- $keys = append $keys (include "irl-dolt.userPasswordKey" .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irl-dolt.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $keys | uniq }}
  {{ . }}: {{ (get $data .) | default (randAlphaNum 40 | b64enc) | quote }}
  {{- end }}
{{- end }}
