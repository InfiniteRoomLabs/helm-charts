apiVersion: v1
kind: Service
metadata:
  name: {{ include "irl-dolt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irl-dolt.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: mysql
      port: {{ .Values.service.port }}
      targetPort: mysql
    {{- if .Values.metrics.enabled }}
    - name: http-metrics
      port: {{ .Values.metrics.port }}
      targetPort: http-metrics
    {{- end }}
  selector:
    {{- include "irl-dolt.serverSelectorLabels" . | nindent 4 }}
---
# Governing Service for the StatefulSet (stable pod DNS name).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "irl-dolt.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irl-dolt.labels" . | nindent 4 }}
    app.kubernetes.io/component: headless
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    {{- include "irl-dolt.serverSelectorLabels" . | nindent 4 }}
{{- if .Values.service.external.enabled }}
---
# Clients outside the cluster. SQL only: metrics stay cluster-internal.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "irl-dolt.fullname" . }}-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irl-dolt.labels" . | nindent 4 }}
    app.kubernetes.io/component: external
  {{- with .Values.service.external.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: NodePort
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      nodePort: {{ .Values.service.external.nodePort }}
  selector:
    {{- include "irl-dolt.serverSelectorLabels" . | nindent 4 }}
{{- end }}
