# `helm test`: the server answers as root, every declared database exists and
# every declared user can log in with its password from the Secret.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "irl-dolt.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irl-dolt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test
      image: {{ include "irl-dolt.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["bash", "/scripts/test.sh"]
      env:
        {{- include "irl-dolt.clientEnv" . | nindent 8 }}
        {{- range $i, $u := .Values.users }}
        - name: DOLT_USER_PASSWORD_{{ $i }}
          valueFrom:
            secretKeyRef:
              name: {{ include "irl-dolt.secretName" $ }}
              key: {{ include "irl-dolt.userPasswordKey" $u }}
        {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      resources:
        {{- toYaml .Values.provision.resources | nindent 8 }}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: scripts
      configMap:
        name: {{ include "irl-dolt.fullname" . }}-scripts
    - name: tmp
      emptyDir: {}
