apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "irl-gunio-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irl-gunio-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "irl-gunio-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "irl-gunio-mcp.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "irl-gunio-mcp.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # ---- (1) gunio-mcp server (streamable HTTP on pod-loopback) ----
        - name: gunio-mcp
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # ENTRYPOINT is `gunio-mcp`; --serve switches stdio -> streamable HTTP.
          args:
            {{- toYaml .Values.app.args | nindent 12 }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          env:
            {{- range $k, $v := .Values.app.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # NO ports: block on purpose -- the server binds 127.0.0.1 inside the
          # pod netns, so the port is not reachable at the pod IP.
          #
          # EXEC probes doing a plain TCP connect from INSIDE the container:
          # a kubelet tcpSocket probe dials the pod IP and would always fail
          # against the loopback bind. FastMCP exposes no clean HTTP health
          # route, so socket reachability is the deliberate ceiling here.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', {{ .Values.app.port }}), timeout=3).close()"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', {{ .Values.app.port }}), timeout=3).close()"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- range .Values.writableEmptyDirs }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
        {{- if .Values.cloudflared.enabled }}
        # ---- (2) cloudflared tunnel sidecar ----
        # Reaches the app over pod-localhost:{{ .Values.app.port }}. Runs the tunnel
        # from a token FILE (mounted from a Secret) -- k8s args are not shell-
        # expanded, so the token cannot be passed inline as "$TUNNEL_TOKEN".
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}@{{ .Values.cloudflared.image.digest }}"
          imagePullPolicy: {{ .Values.cloudflared.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            # http2 transport: many self-hosted/homelab networks block outbound
            # QUIC (UDP/7844); http2 uses TCP/443 and always works where HTTPS does.
            - --protocol
            - {{ .Values.cloudflared.protocol | default "http2" | quote }}
            - run
            - --token-file
            - /etc/cloudflared/token/{{ .Values.cloudflared.tunnelToken.key }}
          resources:
            {{- toYaml .Values.cloudflared.resources | nindent 12 }}
          volumeMounts:
            - name: cloudflared-token
              mountPath: /etc/cloudflared/token
              readOnly: true
            # readOnlyRootFilesystem is true -- give cloudflared a scratch dir.
            - name: cloudflared-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        {{- range .Values.writableEmptyDirs }}
        - name: {{ .name }}
          emptyDir: {}
        {{- end }}
        {{- if .Values.cloudflared.enabled }}
        - name: cloudflared-token
          secret:
            secretName: {{ .Values.cloudflared.tunnelToken.existingSecret }}
            items:
              - key: {{ .Values.cloudflared.tunnelToken.key }}
                path: {{ .Values.cloudflared.tunnelToken.key }}
        - name: cloudflared-tmp
          emptyDir: {}
        {{- end }}
