{{- if .Values.externalSecrets.enabled }}
# ============================================================================
# ExternalSecrets: HashiCorp Vault -> Kubernetes Secrets, via External Secrets
# Operator. First use of the Vault + ESO pattern (workload secrets come from
# Vault; Bitwarden delivers only ESO's own AppRole bootstrap credential).
#
# ORDERING: these objects require the ESO CRDs and the referenced store
# (ClusterSecretStore/vault-irl by default) to exist first. Install ESO and
# apply the store before installing this chart.
#
# remoteRef keys are RELATIVE to the store's KV v2 mount (irl/), i.e.
# "gunio-mcp/app" reads irl/data/gunio-mcp/app.
# ============================================================================
---
# App secret: dataFrom extract copies EVERY key at the Vault path into the
# Secret 1:1, so key names in Vault ARE the env var names (envFrom in the
# deployment). Today that is GUNIO_COOKIE; phase 2 (GUNIO_USERNAME /
# GUNIO_PASSWORD) and an eventual GUNIO_MCP_AUTH_TOKEN land at the same path
# and flow through without a chart change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irl-gunio-mcp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.app.vaultPath }}
---
# cloudflared tunnel token: one explicit key, mounted as a file by the
# deployment (--token-file).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.cloudflared.tunnelToken.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irl-gunio-mcp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.cloudflared.tunnelToken.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.cloudflared.tunnelToken.key }}
      remoteRef:
        key: {{ .Values.externalSecrets.cloudflared.vaultPath }}
        property: {{ .Values.externalSecrets.cloudflared.vaultKey }}
{{- end }}
