apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "irl-jobops.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irl-jobops.labels" . | nindent 4 }}
# The app never talks to the Kubernetes API. Do not mount a token into the pod.
automountServiceAccountToken: false
