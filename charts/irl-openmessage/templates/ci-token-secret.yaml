{{- /*
CI only (ci.ephemeral): a throwaway control token so `ct install` on kind can
boot the pod. Real deployments take the token from secret.existingSecret
(Bitwarden via bw-sync) and never render this.
*/ -}}
{{- if .Values.ci.ephemeral }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "irl-openmessage.fullname" . }}-ci-token
  labels:
    {{- include "irl-openmessage.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.key }}: {{ randAlphaNum 64 | quote }}
{{- end }}
