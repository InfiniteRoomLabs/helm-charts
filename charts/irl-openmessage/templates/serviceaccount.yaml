apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "irl-openmessage.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "irl-openmessage.labels" . | nindent 4 }}
# The daemon never talks to the Kubernetes API. Do not mount a token into the
# pod (the Deployment sets automountServiceAccountToken: false as well).
automountServiceAccountToken: false
