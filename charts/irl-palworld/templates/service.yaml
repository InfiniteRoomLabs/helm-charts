apiVersion: v1
kind: Service
metadata:
  name: {{ include "irl-palworld.fullname" . }}
  labels:
    {{- include "irl-palworld.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Palworld game traffic is UDP-only. Query/RCON/REST are deliberately
    # not exposed -- RCON and REST are pod-internal, and the query port only
    # matters for the community server browser (COMMUNITY=false here).
    - name: game
      port: {{ .Values.service.game.port }}
      targetPort: game
      protocol: UDP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.game.nodePort }}
      nodePort: {{ .Values.service.game.nodePort }}
      {{- end }}
  selector:
    {{- include "irl-palworld.selectorLabels" . | nindent 4 }}
