# irl-palworld/values.yaml
# =========================
# Palworld dedicated server (thijsvanloef/palworld-server-docker).
# https://github.com/thijsvanloef/palworld-server-docker
#
# Port design: same symmetry rule as irl-satisfactory -- the container listens
# directly on the NodePort number (PORT is configurable 1024-65535), so the
# listen port equals the externally reachable port and no NAT-style port
# translation happens anywhere in the path. Game traffic is UDP-only.
#
# RCON stays pod-internal (no Service port): the image's own backup and
# auto-reboot scripts talk to it over localhost, and it is what makes
# SIGTERM-triggered saves graceful. The REST API (TCP) doubles as the
# liveness signal since the game port is UDP and cannot be TCP-probed.

image:
  repository: thijsvanloef/palworld-server-docker
  # Pin this. `latest` means an unannounced game-breaking update is one
  # restart away from your save file.
  tag: "v2.7.1"
  pullPolicy: IfNotPresent

# Game server configuration (maps 1:1 to the image's env vars)
server:
  name: "IRL Palworld"
  # Max players (1-32). Upstream default is 16; LAN crew is smaller.
  players: 8
  # User/group the server process runs as. Must match fsGroup below and the
  # ownership of the ZFS dataset backing the PV.
  puid: 1000
  pgid: 1000
  # Listen port (UDP). Deliberately equal to service.game.nodePort -- see header.
  gamePort: 30211
  # Never list this server in the community browser. LAN + tailnet only.
  community: false
  # SteamCMD update check on boot. false = faster restarts but the server
  # drifts behind the client version.
  updateOnBoot: true
  # Timezone for backup timestamps and the reboot/backup cron expressions.
  timezone: "America/New_York"

# RCON is required for graceful saves on shutdown and for the auto-reboot
# broadcast. ADMIN_PASSWORD comes from a pre-created Secret (bw-sync).
rcon:
  enabled: true
  port: 25575
  # Secret must contain key ADMIN_PASSWORD.
  existingSecret: palworld-secrets

# REST API (TCP, pod-internal). Used as the probe target.
restApi:
  enabled: true
  port: 8212

# The image's built-in tar backups of the save directory (belt) -- ZFS sanoid
# snapshots of the dataset are the suspenders. Cron expressions run in
# server.timezone.
backup:
  enabled: true
  cron: "0 0 * * *"
  deleteOld: true
  keepDays: 30

# Palworld has a well-known server memory leak; a daily reboot while nobody
# is on is the standard mitigation. RCON broadcasts a warning + saves first.
autoReboot:
  enabled: true
  cron: "0 5 * * *"
  evenIfPlayersOnline: false

# Anything else the image supports goes here, rendered verbatim as env vars.
# https://palworld-server-docker.loef.dev/getting-started/configuration/server-settings
extraEnv: {}
  # SERVER_PASSWORD: "..."   # join password; LAN+tailnet only, so off by default
  # WORKER_THREADS_SERVER: "8"

resources:
  requests:
    memory: "6Gi"
    cpu: "2"
  limits:
    memory: "16Gi"
    # Deliberately no CPU limit: CFS throttling on a tick-based sim shows up
    # as rubber-banding. Requests + node pinning instead.

# Persistence -- ZFS-backed PV, created out-of-band by ansible.
# /palworld holds the server install (~8-20Gi, redownloadable), saves/ and
# backups/ (irreplaceable).
persistence:
  enabled: true
  existingClaim: palworld-data-pvc
  size: 30Gi

# Single NodePort Service carrying the UDP game port. LAN clients connect to
# <node-lan-ip>:<game nodePort>; the nftables allowlist on the node must
# permit this port. Query/RCON/REST are deliberately NOT exposed.
service:
  type: NodePort
  game:
    port: 30211
    nodePort: 30211

# Probes hit the REST API TCP port -- UDP probes are meaningless and the REST
# API only answers once the server is actually up.
probes:
  # First boot pulls the ~8-20Gi server through SteamCMD before anything
  # listens. Budget: 60 * 30s = 30 minutes.
  startup:
    periodSeconds: 30
    failureThreshold: 60
  liveness:
    periodSeconds: 30
    failureThreshold: 5
  readiness:
    periodSeconds: 15
    failureThreshold: 3

# Save-on-shutdown (RCON) needs breathing room.
terminationGracePeriodSeconds: 120

podSecurityContext:
  fsGroup: 1000
  # Avoids a recursive chown of the volume on every pod start.
  fsGroupChangePolicy: OnRootMismatch

# Schedule on homelab (needs ZFS storage)
nodeSelector:
  irl.dev/tier: data

tolerations: []
affinity: {}
