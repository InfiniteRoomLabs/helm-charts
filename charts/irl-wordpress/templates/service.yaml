apiVersion: v1
kind: Service
metadata:
  name: {{ include "irl-wordpress.fullname" . }}
  labels:
    {{- include "irl-wordpress.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "irl-wordpress.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
